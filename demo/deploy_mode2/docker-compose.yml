services:
  mosquitto:
    image: eclipse-mosquitto:2
    network_mode: host
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  monitor_node:
    build:
      context: ../..
      dockerfile: Dockerfile
    network_mode: host
    depends_on:
      - mosquitto
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_DISTRO=kilted
      - MONITOR_CONFIG=/demo/deploy_mode2/robot_config.yaml
    volumes:
      - ../../monitor:/monitor
      - ../../custom:/monitor/custom
      - ../common:/demo/common:ro
      - ../../demo/deploy_mode2:/demo/deploy_mode2:ro
      - ../../output/mode2/robot:/output/robot
    command: >
      /bin/bash -lc
      "source /opt/ros/kilted/setup.bash &&
       python3 /demo/common/robot_simulator.py speed-limit-cycle --ros-args -r __node:=mode2_robot &
       python3 /monitor/monitor_node.py --config /demo/deploy_mode2/robot_config.yaml"
    stdin_open: true
    tty: true

  verdict_runner:
    build:
      context: ../..
      dockerfile: Dockerfile
    network_mode: host
    depends_on:
      - mosquitto
    environment:
      - MONITOR_CONFIG=/demo/deploy_mode2/verifier_config.yaml
      - VERDICT_RUNNER_LOG=INFO
    volumes:
      - ../../monitor:/monitor
      - ../../custom:/monitor/custom
      - ../../demo/deploy_mode2:/demo/deploy_mode2:ro
      - ../../output/mode2/verifier:/output/verifier
    command: >
      /bin/bash -lc
      "python3 /monitor/verdict_runner.py --config /demo/deploy_mode2/verifier_config.yaml"
    stdin_open: true
    tty: true
