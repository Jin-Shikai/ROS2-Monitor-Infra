monitor:
  output_dir: /output
  session_id_prefix: nav2_compatible

topics:
  - name: /odom
    type: nav_msgs/msg/Odometry
    transformers:
      - type: FieldExtractor
        fields: [pose.pose.position.x, pose.pose.position.y, twist.twist.linear.x]
    exporters:
      - type: file
  - name: /cmd_vel
    type: geometry_msgs/msg/Twist
    transformers:
      - type: FieldExtractor
        fields: [linear.x, angular.z]
    exporters:
      - type: file

converters:
  - id: cmd_vel_speed
    type: custom.rule_based_converter:RuleBasedConverter
    params:
      source_match: "^/cmd_vel$"
      field_map:
        speed: linear.x
      property_id: nav2_cmd_vel_speed_limit

verdict_services:
  - id: cmd_vel_check
    type: custom.threshold_verdict:ThresholdVerdict
    params:
      property_id: nav2_cmd_vel_speed_limit
      field: speed
      op: ">"
      threshold: 0.30
    exporters:
      - type: stdout
      - type: file
        path: verdicts_{session_id}.jsonl

links:
  - {from: "source:/cmd_vel", to: "converter:cmd_vel_speed"}
  - {from: "converter:cmd_vel_speed", to: "verdict:cmd_vel_check"}
