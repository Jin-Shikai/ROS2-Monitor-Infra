monitor: {output_dir: /output}
inputs:
  - id: local_verdicts
    type: custom.verdict_mqtt_source:VerdictMQTTSource
    broker: mosquitto
    topic_filter: local/#
converters:
  - id: violation_count
    type: custom.verdict_aggregation:LocalViolationCountConverter
verdict_services:
  - id: simultaneous_violations
    type: custom.verdict_aggregation:SimultaneousLocalViolationsVerdict
    params: {minimum_count: 2}
    exporters:
      - {type: stdout}
      - {type: file, path: "aggregate_{session_id}.jsonl"}
links:
  - {from: "converter:violation_count", to: "verdict:simultaneous_violations"}
