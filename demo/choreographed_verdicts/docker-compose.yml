services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ../deploy_mode2/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  robot1:
    build: {context: ../.., dockerfile: Dockerfile}
    depends_on: [mosquitto]
    volumes:
      - ../../monitor:/monitor
      - ../../custom:/monitor/custom
      - ../common:/demo/common:ro
      - ./robot1.yaml:/demo/config.yaml:ro
    command: /bin/bash -lc "source /opt/ros/kilted/setup.bash && python3 /demo/common/robot_simulator.py speed-limit-cycle --ros-args -r __node:=robot1 -r __ns:=/robot1 & python3 /monitor/monitor_node.py -c /demo/config.yaml"

  robot2:
    build: {context: ../.., dockerfile: Dockerfile}
    depends_on: [mosquitto]
    volumes:
      - ../../monitor:/monitor
      - ../../custom:/monitor/custom
      - ../common:/demo/common:ro
      - ./robot2.yaml:/demo/config.yaml:ro
    command: /bin/bash -lc "source /opt/ros/kilted/setup.bash && python3 /demo/common/robot_simulator.py speed-limit-cycle --ros-args -r __node:=robot2 -r __ns:=/robot2 & python3 /monitor/monitor_node.py -c /demo/config.yaml"

  aggregator:
    build: {context: ../.., dockerfile: Dockerfile}
    depends_on: [mosquitto]
    volumes:
      - ../../monitor:/monitor
      - ../../custom:/monitor/custom
      - ./aggregator.yaml:/demo/aggregator.yaml:ro
      - ../../output/choreographed:/output
    command: python3 /monitor/node_runner.py -c /demo/aggregator.yaml
