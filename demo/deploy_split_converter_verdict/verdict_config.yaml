# Verdict host — consumes the converter's DSL records, emits verdicts.
# Run with: python monitor/node_runner.py -c demo/deploy_split_converter_verdict/verdict_config.yaml
monitor:
  output_dir: /output/verifier

inputs:
  - id: dsl_in
    payload: dsl
    type: mqtt
    broker: 127.0.0.1
    port: 1883
    topic: dsl/odom_speed
    qos: 1

verdict_services:
  - id: odom_speed_check
    type: custom.odom_speed_verdict:OdomSpeedVerdict
    exporters:
      - type: stdout
      - type: file
        path: verdicts_{session_id}.jsonl

links:
  - {from: "input:dsl_in", to: "verdict:odom_speed_check"}
