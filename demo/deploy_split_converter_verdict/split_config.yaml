# Converter host AND verdict host share this one file; split_runner reads only
# the parts each --role needs.
#
#   converter host: python monitor/split_runner.py --role converter -c <this>
#   verdict   host: python monitor/split_runner.py --role verdict   -c <this>
#
# Topology:  robot --monitor/#--> converter --dsl/odom_speed--> verdict
monitor:
  output_dir: /output/verifier

verdict_runner:
  # Inbound raw DataRecords from the robot. Read by --role converter only.
  source:
    type: mqtt
    broker: 127.0.0.1
    port: 1883
    topic_filter: monitor/#
    qos: 1

converters:
  - type: custom.odom_speed_converter:OdomSpeedConverter
    # The seam joining the two hosts: the converter publishes its DSL records
    # here, the verdict host subscribes here. Supported keys:
    # topic (required), broker, port, qos, keepalive.
    dsl_transport:
      broker: 127.0.0.1
      port: 1883
      topic: dsl/odom_speed
      qos: 1
    # Run by --role verdict only.
    verdict:
      type: custom.odom_speed_verdict:OdomSpeedVerdict
      exporters:
        - type: stdout
        - type: file
          path: verdicts_{session_id}.jsonl
