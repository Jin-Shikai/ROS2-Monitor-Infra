# Converter host — consumes the robot's DataRecords, publishes DSL records.
# Run with: python monitor/node_runner.py -c demo/deploy_split_converter_verdict/converter_config.yaml
#
# Topology:  robot --monitor/#--> converter --dsl/odom_speed--> verdict
monitor:
  output_dir: /output/converter

inputs:
  - id: robot_feed
    type: mqtt
    broker: 127.0.0.1
    port: 1883
    topic_filter: monitor/#
    qos: 1

converters:
  - id: odom_speed
    type: custom.odom_speed_converter:OdomSpeedConverter

outputs:
  - id: dsl_out
    payload: dsl
    type: mqtt
    broker: 127.0.0.1
    port: 1883
    topic: dsl/odom_speed
    qos: 1

links:
  - {from: "converter:odom_speed", to: "output:dsl_out"}
