monitor: {output_dir: /output}
inputs:
  - {id: fleet_feed, type: mqtt, broker: mosquitto, topic_filter: "monitor/#"}
converters:
  - id: robot1_speed
    type: custom.rule_based_converter:RuleBasedConverter
    params:
      source_match: "^/robot1/odom$"
      field_map: {speed: twist.twist.linear.x}
      property_id: robot1_speed
  - id: robot2_speed
    type: custom.rule_based_converter:RuleBasedConverter
    params:
      source_match: "^/robot2/odom$"
      field_map: {speed: twist.twist.linear.x}
      property_id: robot2_speed
verdict_services:
  - id: robot1_check
    type: custom.threshold_verdict:ThresholdVerdict
    params: {property_id: robot1_speed, field: speed, op: ">", threshold: 0.30}
    exporters: [{type: stdout}, {type: file, path: "robot1_{session_id}.jsonl"}]
  - id: robot2_check
    type: custom.threshold_verdict:ThresholdVerdict
    params: {property_id: robot2_speed, field: speed, op: ">", threshold: 0.30}
    exporters: [{type: stdout}, {type: file, path: "robot2_{session_id}.jsonl"}]
links:
  - {from: "source:/robot1/odom", to: "converter:robot1_speed"}
  - {from: "source:/robot2/odom", to: "converter:robot2_speed"}
  - {from: "converter:robot1_speed", to: "verdict:robot1_check"}
  - {from: "converter:robot2_speed", to: "verdict:robot2_check"}
