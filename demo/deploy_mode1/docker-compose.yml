services:
  monitor_node:
    build:
      context: ../..
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - ../../monitor:/monitor
      - ../../custom:/monitor/custom
      - ../common:/demo/common:ro
      - ../../demo/deploy_mode1:/demo/deploy_mode1:ro
      - ../../output/mode1:/output/mode1
    command: >
      /bin/bash -lc
      "source /opt/ros/kilted/setup.bash &&
       python3 /demo/common/robot_simulator.py speed-limit-cycle --ros-args -r __node:=mode1_robot &
       python3 /monitor/monitor_node.py --config /demo/deploy_mode1/config.yaml"
    stdin_open: true
    tty: true
