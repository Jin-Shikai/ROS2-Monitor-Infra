monitor:
  output_dir: /output
  session_id_prefix: hybrid_robot1
topics:
  - name: /odom
    type: nav_msgs/msg/Odometry
    transformers:
      - type: FieldExtractor
        fields: [twist.twist.linear.x]
    exporters:
      - type: mqtt
        broker: mosquitto
        topic_prefix: monitor/robot1/
converters:
  - id: odom_speed
    type: custom.odom_speed_converter:OdomSpeedConverter
verdict_services:
  - id: local_check
    type: custom.odom_speed_verdict:OdomSpeedVerdict
    exporters:
      - type: stdout
      - type: file
        path: local_verdicts_{session_id}.jsonl
links:
  - {from: "source:/odom", to: "converter:odom_speed"}
  - {from: "converter:odom_speed", to: "verdict:local_check"}
