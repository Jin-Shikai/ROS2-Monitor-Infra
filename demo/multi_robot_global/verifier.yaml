monitor: {output_dir: /output}
inputs:
  - {id: fleet_feed, type: mqtt, broker: mosquitto, topic_filter: "global/#"}
converters:
  - id: fleet_distance
    type: custom.fleet_distance:FleetDistanceConverter
    params: {robot_a: /robot1, robot_b: /robot2}
verdict_services:
  - id: fleet_distance_check
    type: custom.fleet_distance:MinimumFleetDistanceVerdict
    params: {minimum_distance: 1.0}
    exporters:
      - {type: stdout}
      - {type: file, path: "fleet_distance_{session_id}.jsonl"}
links:
  - {from: "source:/robot1/odom", to: "converter:fleet_distance"}
  - {from: "source:/robot2/odom", to: "converter:fleet_distance"}
  - {from: "converter:fleet_distance", to: "verdict:fleet_distance_check"}
