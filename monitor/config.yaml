monitor:
  output_dir: ./output
  session_id_prefix: ""

topics:
  - name: /odom
    type: nav_msgs/msg/Odometry
    transformers:
      - type: FieldExtractor
        fields:
          - pose.pose.position.x
          - pose.pose.position.y
          - twist.twist.linear.x
          - twist.twist.angular.z
      - type: RateThrottler
        max_rate_hz: 5.0

services:
  - name: /set_bool
    type: std_srvs/srv/SetBool

actions:
  - name: /fibonacci
    type: example_interfaces/action/Fibonacci
    phases: [feedback, status]

exporters:
  - type: file
  - type: mqtt
    broker: localhost
    port: 1883
    topic_prefix: monitor/
    qos: 1
    max_queued_messages: 1000
    publish_bookends: true

# Verdict-runner config (consumed by monitor/verdict_runner.py only).
# Only this block and `converters:` are read on the verdict box; rclpy is NOT
# required there. Run with:
#   python3 monitor/verdict_runner.py --config monitor/config.yaml
verdict_runner:
  broker: localhost
  port: 1883
  topic_filter: monitor/#
  qos: 1

# DSL evaluation chains. Each entry wires a DataConverter to a VerdictService.
# Use a builtin name (e.g. RuleBasedConverter / ThresholdVerdict) or a Python
# import path of the form 'module.path:ClassName' for user-defined classes.
converters:
  - type: custom.rule_based_converter:RuleBasedConverter
    source_match: "^/odom$"
    field_map:
      velocity: twist.twist.linear.x
    property_id: odom_speed_limit
    verdict:
      type: custom.threshold_verdict:ThresholdVerdict
      property_id: odom_speed_limit
      field: velocity
      op: ">"
      threshold: 0.5
      sustain_sec: 0.0
      # New unified schema: one or more Exporter[Verdict] instances.
      # Built-in types: file, stdout, mqtt. User-defined exporters use
      # 'module.path:ClassName'. The legacy 'output: <path>' is still
      # accepted as syntactic sugar for [{type: file, path: <path>}].
      exporters:
        - type: file
          path: verdicts_{session_id}.jsonl
        # - type: mqtt
        #   broker: localhost
        #   port: 1883
        #   topic: verdicts/robot1/odom_speed_limit
        #   qos: 1
        # - type: stdout
