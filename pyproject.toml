[project]
name = "ROS2-Monitor-Infra"
version = "0.1.0"
description = "Configurable runtime monitoring and verification infrastructure for ROS 2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["test/unit"]
pythonpath = ["monitor", "."]
addopts = "-ra"

[tool.pyright]
extraPaths = ["monitor", "."]
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=9.0.3",
]
